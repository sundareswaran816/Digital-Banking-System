server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path=/customers,/customers/**

            - id: account-service
              uri: http://localhost:8082
              predicates:
                - Path=/accounts,/accounts/**

            - id: transaction-service
              uri: http://localhost:8083
              predicates:
                - Path=/transactions,/transactions/**

            - id: loan-service
              uri: http://localhost:8084
              predicates:
                - Path=/loans,/loans/**